name: Android Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    # 允许手动触发构建

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set fork version
        run: bash lib/scripts/build_fork.sh

      # 核心修改点：使用 --debug 模式
      # 注意：Debug 模式下通常不使用 --split-per-abi，因为它会生成一个包含全架构的胖 APK
      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub

      - name: Rename Debug APK
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliPala_android_debug_all.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_Debug_APK
          path: output/PiliPala_android_debug_all.apk