name: VOD Proxy Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/plugin/vod_proxy/**"
      - "test/plugin/vod_proxy/**"
      - ".github/workflows/vod_proxy_test.yml"
  pull_request:
    paths:
      - "lib/plugin/vod_proxy/**"
      - "test/plugin/vod_proxy/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Test
        run: flutter test test/plugin/vod_proxy
